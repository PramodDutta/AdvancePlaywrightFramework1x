  <path d="M766 162 L766 178 L460 178 L460 166" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="613" y="174" text-anchor="middle" font-size="11" fill="#dc2626">fix in POM / @testdata, re-run</text>

